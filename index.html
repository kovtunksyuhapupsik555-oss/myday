<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой день</title>
<!-- иконка на экране телефона: рассвет над морем, как в самом приложении -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="theme-color" content="#282344">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap">
<style>
  :root{
    color-scheme: dark;

    --sky-1:#282344; --sky-2:#3b3253; --sky-3:#574560; --sky-4:#6b5163;
    --sun:#FFD3AE; --sun-2:#FF9E8A;

    --panel:rgba(44,37,62,.64);
    --panel-2:rgba(60,50,84,.58);
    --panel-solid:#2c2743;
    --stroke:rgba(255,226,236,.15);
    --stroke-2:rgba(255,226,236,.32);

    /* фоновое фото + полупрозрачные кнопки */
    --bg-photo:url("https://images.unsplash.com/photo-1743535363334-2841caa6130e?w=1400&q=72&auto=format&fit=crop");
    --accent-glass:rgba(255,143,168,.62);
    --accent-glass-2:rgba(242,109,142,.64);

    --ink:#F4EDF2;
    --ink-soft:#CBBAD0;
    --ink-faint:#A997AF;

    --accent:#FF8FA8;
    --accent-deep:#F26D8E;
    --accent-ink:#3a1622;
    --accent-glow:rgba(255,143,168,.42);

    /* типы дел */
    --work:#7FD6A8;      --work-soft:rgba(127,214,168,.4);
    --food:#F4C97D;
    --rest:#C0A4F0;      --rest-soft:rgba(192,164,240,.4);
    --yellow-deep:#F4C97D;

    --radius:22px;
    --radius-sm:14px;
    --ease:cubic-bezier(.4,.08,.2,1);

    --display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
    --title:"Cormorant Garamond","Zen Kaku Gothic New",Georgia,serif;
    --body:"Manrope","SF Pro Text",system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,a,.next,.task,.wday,.cli,.cal-cell,.chip,.bfilter,.nav button,.fab,.fab-add{
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
  }
  .fab,.fab-add,.btn{transition:transform .09s var(--ease), filter .09s var(--ease)}
  .fab:active,.fab-add:active,.btn:active{transform:scale(.96);filter:brightness(.95)}
  .next,.task,.wday,.cli{transition:transform .09s var(--ease)}
  .next:active,.task:active,.wday:active,.cli:active{transform:scale(.985)}
  .cal-cell:not(.out):active{transform:scale(.92)}
  .chip,.bfilter,.cal-nav button{transition:transform .09s var(--ease)}
  .chip:active,.bfilter:active,.cal-nav button:active{transform:scale(.93)}
  .nav button:active{transform:scale(.9)}
  .check:active{transform:scale(.85)}

  html,body{margin:0;padding:0}
  body{
    font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    background:var(--sky-1);
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:calc(170px + env(safe-area-inset-bottom));
  }
  /* реальное фото + затемняющий градиент — фиксированный слой позади контента */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(179deg, rgba(28,24,46,.62) 0%, rgba(43,36,62,.46) 42%, rgba(63,48,70,.44) 74%, rgba(82,58,74,.52) 100%),
      var(--bg-photo);
    background-size:cover,cover;
    background-position:center,center;
    background-repeat:no-repeat,no-repeat;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 24% at 50% 116%, rgba(255,158,138,.20), transparent 62%);
  }

  .screen{display:none;padding:20px 15px 8px;position:relative;z-index:1}
  .screen.active{display:block}
  #screen-today{padding-bottom:200px}

  .hero{position:relative;margin:0 0 16px;padding:2px 0 6px;text-align:center}
  .day-date{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
  .hero-title{font-family:var(--title);font-size:42px;font-weight:600;letter-spacing:.02em;margin:4px 0 0;color:#FFB3C6;text-shadow:0 2px 12px rgba(0,0,0,.35), 0 0 26px var(--accent-glow)}

  /* glass card */
  .card{
    background:var(--panel);
    -webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);
    border:1px solid var(--stroke);border-radius:var(--radius);
    box-shadow:0 22px 46px -22px rgba(20,10,26,.55), inset 0 1px 0 rgba(255,255,255,.07);
    overflow:hidden;margin-bottom:12px;
  }
  .card__tab{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.95;padding:16px 18px 0}
  .card__body{padding:8px 18px 18px}
  .card--pink,.card--lav,.card--mint,.card--blue,.card--yellow{border-color:var(--stroke)}
  .card--yellow .card__tab{color:var(--ink-soft)}

  .next{cursor:pointer;position:relative;overflow:hidden}
  .next__row{display:flex;align-items:flex-start;gap:14px}
  .next__time{font-family:var(--display);font-size:44px;font-weight:300;line-height:.95;color:var(--accent);text-shadow:0 0 24px var(--accent-glow);font-variant-numeric:tabular-nums}
  .next__name{font-size:16px;font-weight:600;flex:1;min-width:0;line-height:1.3;margin-top:8px}
  .next__contact{margin-top:10px;font-size:13px;color:var(--ink-soft);font-weight:500}
  .next--empty .card__body{color:var(--ink-soft);font-weight:600}
  .next__jp{margin-top:15px;padding-top:12px;border-top:1px solid var(--stroke);font-family:var(--display)}
  .next__jp b{font-weight:400;font-size:13.5px;color:var(--ink-soft);letter-spacing:.04em}
  .next__jp span{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-faint);margin-top:3px}

  .counters{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:20px}
  .mini{margin-bottom:0}
  .mini .card__tab{font-size:9.5px;letter-spacing:.14em;padding:12px 12px 0}
  .mini .card__body{padding:6px 12px 13px}
  .mini__num{font-family:var(--display);font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .mini__cap{font-size:10px;color:var(--ink-faint);min-height:24px;line-height:1.25;margin-top:1px;font-weight:500}
  .bar{height:3px;border-radius:2px;background:var(--stroke);overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));box-shadow:0 0 8px var(--accent-glow)}

  .feed-h{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:6px 4px 11px;font-weight:500}
  .task{
    position:relative;display:flex;align-items:flex-start;gap:12px;
    background:var(--panel);border:1px solid var(--stroke);border-radius:16px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:13px 13px 13px 18px;margin-bottom:9px;
    overflow:hidden;transition:opacity .25s, transform .09s var(--ease);cursor:pointer;
  }
  .task__band{position:absolute;left:0;top:0;bottom:0;width:4px}
  .task.clients .task__band,.task.study .task__band{background:var(--work)}
  .task.food .task__band{background:var(--food)}
  .task.personal .task__band{background:var(--rest)}
  .task .t-body{flex:1;min-width:0}
  .task .t-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .task .t-time{font-family:var(--display);font-weight:400;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .task .t-title{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .t-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;font-weight:500}
  .task.done{opacity:.5}
  .task.done .t-title{text-decoration:line-through;color:var(--ink-soft)}
  .check{
    flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--stroke-2);
    background:transparent;display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:pointer;padding:0;
    transition:background .15s,border-color .15s,transform .09s var(--ease);
  }
  .check.on{background:var(--accent);border-color:var(--accent)}
  .check svg{width:12px;height:12px;stroke:var(--accent-ink);stroke-width:3;fill:none;display:none}
  .check.on svg{display:block}

  /* week */
  .week-hero{position:relative;text-align:center;margin:2px 0 16px;padding:8px 0 4px}
  .week-hero .hero-title{font-size:38px;font-weight:600}
  .wday{
    position:relative;display:flex;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--stroke);border-radius:16px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:12px 14px 12px 18px;margin-bottom:9px;cursor:pointer;overflow:hidden;
  }
  .wday__band{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stroke-2)}
  .wday.busy .wday__band{background:var(--work)}
  .wday.packed .wday__band{background:var(--accent)}
  .wday.today{border-color:var(--accent);box-shadow:0 0 16px rgba(255,143,168,.18)}
  .wday__date{flex:none;width:44px;text-align:center}
  .wday__dow{font-family:var(--display);font-weight:500;font-size:12px;text-transform:capitalize;color:var(--ink-soft)}
  .wday__num{font-size:14px;color:var(--ink);font-weight:300;font-family:var(--display);margin-top:1px}
  .wday__body{flex:1;min-width:0}
  .wday__items{font-size:12px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wday.free .wday__items{color:var(--ink-faint)}
  .wday__meta{font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:5px;display:flex;align-items:center;gap:7px}
  .wday__dots{display:flex;gap:3px}
  .wday__dots i{width:4px;height:4px;border-radius:50%;background:var(--stroke-2)}
  .wday__dots i.on{background:var(--accent)}
  .wday__tag{background:rgba(255,143,168,.16);color:var(--accent);font-family:var(--display);font-size:9px;font-weight:500;padding:3px 8px;border-radius:8px;letter-spacing:.02em}

  .daylist{display:flex;flex-direction:column;margin:6px 0 4px}
  .dayrow{display:flex;gap:10px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--stroke)}
  .dayrow:last-child{border-bottom:0}
  .dayrow__dot{flex:none;width:7px;height:7px;border-radius:50%;align-self:flex-start;margin-top:5px}
  .dayrow__dot.clients,.dayrow__dot.study{background:var(--work)}
  .dayrow__dot.food{background:var(--food)}
  .dayrow__dot.personal{background:var(--rest)}
  .dayrow__time{font-family:var(--display);font-weight:400;font-size:12.5px;color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
  .dayrow__title{font-size:13.5px;font-weight:500;line-height:1.4}
  .dayrow__sub{color:var(--ink-soft);font-weight:500}
  .sheet-sec{font-family:var(--display);font-size:10.5px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.14em;margin:16px 0 7px}

  /* calendar */
  .cal-hero{position:relative;text-align:center;margin:2px 0 12px;padding:8px 0 4px}
  .cal-hero .hero-title{font-size:36px;font-weight:600}
  .cal-hero .day-date{text-transform:none;font-size:12px;letter-spacing:.02em;color:var(--ink-soft);font-weight:600;margin-top:5px}
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
  .cal-nav button{width:34px;height:34px;border:1px solid var(--stroke-2);background:var(--panel-2);border-radius:11px;font-family:var(--display);font-size:19px;font-weight:600;color:#FFF8FB;cursor:pointer;line-height:1;padding:0}
  .cal-nav span{font-family:var(--display);font-weight:700;font-size:16px;color:#FFF8FB;text-transform:capitalize;min-width:128px;text-align:center;letter-spacing:.01em}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
  .cal-dow span{text-align:center;font-family:var(--display);font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-cell{
    aspect-ratio:1/1;border:1px solid var(--stroke);background:var(--panel-2);border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:var(--display);font-weight:600;font-size:15px;color:#FFF8FB;cursor:pointer;
  }
  .cal-cell.out{opacity:.45;cursor:default}
  .cal-cell.today{border-color:var(--accent);border-width:2px;color:var(--accent);font-weight:800}
  .cal-cell__dots{display:flex;gap:2px;height:5px}
  .cal-cell__dots i{width:3px;height:3px;border-radius:50%;background:var(--accent)}
  .cal-cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* база */
  .base-hero{position:relative;text-align:center;margin:2px 0 14px;padding:8px 0 4px}
  .base-hero .hero-title{font-size:36px;font-weight:600}
  .base-hero .day-date{text-transform:none;font-size:11px;letter-spacing:.02em;color:var(--ink-soft);font-weight:400;margin-top:5px}
  .base-search{width:100%;height:44px;border:1px solid var(--stroke-2);border-radius:13px;background:rgba(14,9,20,.35);
    padding:0 14px;font-family:var(--body);font-size:15px;font-weight:500;color:var(--ink);margin-bottom:11px}
  .base-search::placeholder{color:var(--ink-faint)}
  .base-search:focus{outline:0;border-color:var(--accent)}
  .base-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .base-filters::-webkit-scrollbar{display:none}
  .bfilter{flex:none;border:1px solid var(--stroke-2);background:var(--panel-2);border-radius:10px;
    padding:6px 11px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .bfilter.on{background:var(--ink);border-color:var(--ink);color:var(--panel-solid)}
  .cli{position:relative;background:var(--panel);border:1px solid var(--stroke);border-left:2px solid var(--stroke-2);border-radius:14px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:12px 14px;margin-bottom:9px;cursor:pointer}
  .cli.due{border-left-color:var(--accent);box-shadow:0 0 16px rgba(255,143,168,.16)}
  .cli__top{display:flex;align-items:center;gap:8px}
  .cli__name{font-family:var(--display);font-weight:500;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cli__hist{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cli__touch{font-size:11px;font-weight:600;color:var(--ink-faint);margin-top:6px}
  .cli__touch.today{color:var(--accent)}
  .st{display:inline-block;font-family:var(--display);font-size:10px;font-weight:500;padding:4px 9px;border-radius:8px;white-space:nowrap;letter-spacing:.02em}
  .st.s-work{background:rgba(127,214,168,.16);color:var(--work)}
  .st.s-zoom{background:rgba(192,164,240,.16);color:var(--rest)}
  .st.s-bill{background:rgba(255,143,168,.16);color:var(--accent)}
  .st.s-hold{background:rgba(244,201,125,.16);color:var(--food)}
  .st.s-won{background:rgba(127,214,168,.22);color:var(--work)}
  .st.s-lost{background:rgba(169,151,175,.18);color:var(--ink-faint)}
  .base-empty{text-align:center;color:var(--ink-soft);font-weight:600;padding:44px 20px;font-size:13px}

  .fab{
    position:fixed;left:15px;right:80px;bottom:calc(84px + env(safe-area-inset-bottom));
    height:52px;border:0;border-radius:16px;
    background:linear-gradient(180deg,var(--accent-glass),var(--accent-glass-2));color:var(--accent-ink);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
    border:1px solid rgba(255,255,255,.22);
    font-family:var(--body);font-size:14.5px;font-weight:700;
    box-shadow:0 16px 32px -10px rgba(18,9,24,.5), inset 0 1px 0 rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;gap:8px;z-index:20;cursor:pointer;
  }
  .fab-add{
    position:fixed;right:15px;bottom:calc(84px + env(safe-area-inset-bottom));
    width:52px;height:52px;border:0;border-radius:16px;background:var(--panel);color:var(--accent);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--stroke-2);
    font-family:var(--display);font-size:24px;font-weight:400;line-height:1;
    box-shadow:0 16px 30px -10px rgba(20,10,26,.5);
    display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;
  }
  .fab.hidden,.fab-add.hidden{display:none}

  .nav{
    position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    height:64px;border-radius:20px;
    background:var(--panel);border:1px solid var(--stroke);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
    box-shadow:0 18px 40px -14px rgba(15,8,20,.6);
    display:flex;padding:0 6px;z-index:30;
  }
  .nav button{
    flex:1;border:0;background:none;font-family:var(--display);font-size:9.5px;font-weight:500;letter-spacing:.03em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
    color:var(--ink-faint);transition:transform .09s var(--ease),color .15s var(--ease);
  }
  .nav .ico{width:22px;height:22px;border-radius:8px;border:1.6px solid currentColor;display:flex;align-items:center;justify-content:center;transition:background .15s,box-shadow .15s}
  .nav .ico b{display:none}
  .nav button.on{color:var(--accent)}
  .nav button.on .ico{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px var(--accent-glow)}

  .stub{text-align:center;padding:90px 26px;color:var(--ink-soft)}
  .stub .s-emoji{font-size:44px;line-height:1;display:block;margin-bottom:14px}
  .stub h2{font-family:var(--display);color:var(--ink);font-size:20px;margin:0 0 6px;font-weight:500}
  .stub p{margin:0;font-size:13.5px;font-weight:500}

  .overlay{position:fixed;inset:0;background:rgba(12,7,18,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{
    width:100%;max-width:520px;background:linear-gradient(180deg,var(--panel-solid),#25203a);
    border-radius:26px 26px 0 0;border-top:1px solid var(--stroke-2);
    padding:20px 17px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 40px rgba(10,5,16,.5);animation:sheetUp .22s var(--ease);max-height:92%;overflow-y:auto;
  }
  @keyframes sheetUp{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{font-family:var(--display);margin:0 0 4px;font-size:18px;font-weight:500}
  .sheet .muted{color:var(--ink-soft);font-size:12.5px;margin-bottom:12px;line-height:1.5;font-weight:500}
  .sheet label{display:block;font-family:var(--display);font-size:10.5px;color:var(--ink-soft);margin:13px 0 5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  .sheet input{
    width:100%;height:46px;border:1px solid var(--stroke-2);border-radius:13px;background:rgba(14,9,20,.4);
    padding:0 14px;font-family:var(--body);font-size:16px;font-weight:500;color:var(--ink);
  }
  .sheet input::placeholder{color:var(--ink-faint)}
  .sheet input:focus{outline:0;border-color:var(--accent)}
  .time-inp{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.02em;margin-top:8px}
  .time-row{display:flex;gap:8px;align-items:stretch;margin-top:8px}
  .time-row .time-inp{margin-top:0;flex:1}
  .btn.time-go{width:auto;flex:none;margin-top:0;padding:0 18px;height:46px;border-radius:13px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{
    border:1px solid var(--stroke-2);background:var(--panel-2);border-radius:12px;
    padding:8px 13px;font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip.type-study.on{background:var(--work);border-color:var(--work);color:var(--accent-ink)}
  .chip.type-food.on{background:var(--food);border-color:var(--food);color:var(--accent-ink)}
  .chip.type-personal.on{background:var(--rest);border-color:var(--rest);color:var(--accent-ink)}
  .btn{
    width:100%;height:50px;border:0;border-radius:15px;
    background:linear-gradient(180deg,var(--accent-glass),var(--accent-glass-2));color:var(--accent-ink);
    -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid rgba(255,255,255,.2);
    font-family:var(--body);font-size:15px;font-weight:700;margin-top:16px;cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(18,9,24,.45), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn.lav{background:var(--panel-2);color:var(--ink);border:1px solid var(--stroke-2);box-shadow:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;margin-top:4px;height:42px}
  .status-pill{display:inline-block;background:rgba(255,143,168,.16);color:var(--accent);font-family:var(--display);font-size:11px;font-weight:500;padding:5px 11px;border-radius:10px;margin-bottom:10px}
  .cli-notes{background:rgba(14,9,20,.32);border:1px solid var(--stroke);border-radius:13px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.55;font-weight:500}
  .row2{display:flex;gap:10px;margin-top:15px}
  .row2 .btn{margin-top:0}

  .toast{
    position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(20,12,26,.95);border:1px solid var(--stroke-2);color:var(--ink);font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;
    max-width:82%;text-align:center;
  }
  .toast.show{opacity:1}

  .fatal{padding:80px 26px;text-align:center;color:var(--ink-soft);position:relative;z-index:1}
  .fatal h2{font-family:var(--display);color:var(--ink);font-weight:500}
  .fatal button{margin-top:16px;height:46px;padding:0 22px;border:0;border-radius:13px;background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--accent-ink);font-family:var(--body);font-weight:700;font-size:15px}

  button:focus-visible,.task:focus-visible,.next:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .sheet{animation:none}
    *{transition:none!important}
  }
  .dayrow.tapable{cursor:pointer;border-radius:12px;padding-right:6px}
  .dayrow.tapable:active{background:rgba(255,255,255,.06)}
  .dayrow__go{margin-left:auto;color:var(--accent,#FF8FA8);font-weight:700;padding-left:6px}
  /* переключатель дня на главном экране */
  .daysw{display:inline-flex;gap:4px;margin-top:10px;padding:3px;border-radius:14px;
    background:rgba(52,44,74,.5);border:1px solid rgba(255,226,236,.14)}
  .daysw__b{border:0;background:transparent;color:var(--ink-soft);font-family:var(--body);
    font-size:13px;font-weight:700;padding:7px 16px;border-radius:11px;cursor:pointer}
  .daysw__b.on{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--accent-ink)}
</style>
</head>
<body>

<main id="app"></main>

<div id="screen-today" class="screen active">
  <div class="hero">
    <div class="day-date" id="dayDate">—</div>
    <div class="hero-title" id="heroTitle" aria-label="Мой день"></div>
    <div class="daysw" id="daySwitch">
      <button class="daysw__b on" data-view="today">Сегодня</button>
      <button class="daysw__b" data-view="tomorrow">Завтра</button>
    </div>
  </div>
  <div class="card card--mint next" id="nextBlock" tabindex="0"></div>
  <div class="counters" id="counters"></div>
  <div class="feed-h">Дела на день</div>
  <div id="feed"></div>
</div>

<div id="screen-week" class="screen">
  <div class="week-hero">
    <div class="day-date" id="weekRange">—</div>
    <h2 class="hero-title" id="weekTitle" aria-label="Неделя"></h2>
  </div>
  <div id="weekList"></div>
</div>
<div id="screen-calendar" class="screen">
  <div class="cal-hero">
    <h2 class="hero-title" id="calTitle" aria-label="Календарь"></h2>
    <div class="day-date" id="calSub">тап по числу — план дня и окна для зума</div>
  </div>
  <div class="cal-nav">
    <button id="calPrev" aria-label="Предыдущий месяц">‹</button>
    <span id="calMonthLbl">—</span>
    <button id="calNext" aria-label="Следующий месяц">›</button>
  </div>
  <div class="cal-dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
  <div class="cal-grid" id="calGrid"></div>
</div>
<div id="screen-base" class="screen">
  <div class="base-hero">
    <h2 class="hero-title" id="baseTitle" aria-label="База"></h2>
    <div class="day-date" id="baseSub">клиенты, статусы и следующее касание</div>
  </div>
  <input class="base-search" id="baseSearch" type="search" placeholder="Поиск по имени" autocomplete="off">
  <div class="base-filters" id="baseFilters"></div>
  <div id="baseList"></div>
</div>

<button class="fab" id="fab">Поставить встречу</button>
<button class="fab-add" id="fabAdd" aria-label="Добавить дело">＋</button>

<nav class="nav" id="nav">
  <button data-scr="today" class="on"><span class="ico"><b></b></span>Сегодня</button>
  <button data-scr="week"><span class="ico"><b></b></span>Неделя</button>
  <button data-scr="calendar"><span class="ico"><b></b></span>Календарь</button>
  <button data-scr="base"><span class="ico"><b></b></span>База</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Telegram ---------- */
var TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
function haptic(k){ try { TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred(k||'light'); } catch(e){} }

/* ---------- store (localStorage сейчас, под замену на API) ---------- */
var STORE_KEY = 'myday_v4';

/* Федя: приложение можно повесить иконкой на экран телефона. Вне телеграма подписи нет,
   поэтому один раз открываем ссылку с ключом — он сохраняется и дальше подставляется сам. */
var MY_KEY = (function(){
  try {
    var m = location.search.match(/[?&]k=([^&]+)/);
    if (m){ localStorage.setItem('myday_key', decodeURIComponent(m[1])); }
    return localStorage.getItem('myday_key') || '';
  } catch(e){ return ''; }
})();
var store = {
  /* Федя: данные берём с сервера — он их и наполняет из календаря и таблицы.
     Запрос подписан телеграмом, чужому сервер данные не отдаст.
     Локальные галочки «сделано» переносим на свежие данные, localStorage — запасной вариант. */
  load: function(){
    return new Promise(function(resolve, reject){
      var local = null;
      try { local = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
      var tgi = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
      fetch('data.json?v=' + Date.now() + '&init=' + encodeURIComponent(tgi) +
            (MY_KEY ? '&k=' + encodeURIComponent(MY_KEY) : ''))
        .then(function(r){
          if (r.status === 403) throw new Error('Это личное приложение. Откройте его из своего Telegram');
          if (!r.ok) throw new Error('data.json ' + r.status);
          return r.json();
        })
        .then(function(data){
          if (local && local.tasks && data.tasks){
            var was = {};
            local.tasks.forEach(function(t){ if (t.done && t.key) was[t.key] = true; });
            data.tasks.forEach(function(t){ if (t.key && was[t.key]) t.done = true; });
          }
          try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){}
          resolve(data);
        })
        .catch(function(err){ if (local) resolve(local); else reject(err); });
    });
  },
  save: function(data){
    return new Promise(function(resolve){
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){}
      resolve(true);
    });
  },
  reset: function(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }
};

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function toMin(s){ if (!s) return 1e9; var p = s.split(':'); return (+p[0])*60 + (+p[1]); }
function fromMin(m){ var h = Math.floor(m/60), mm = m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
function fmtMoney(n){ return (n||0).toLocaleString('ru-RU'); }
function daysUntil(iso){
  var d = new Date(iso+'T00:00:00'); var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now)/86400000);
}
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return (D && D.date) || ymd(new Date()); }
function tomorrowKey(){ var d = new Date(todayKey()+'T12:00:00'); d.setDate(d.getDate()+1); return ymd(d); }
function taskDay(t){ return t.day || todayKey(); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s){ return (s || '').replace(/"/g, '&quot;'); }
function humanDay(key){
  if (key === todayKey()) return 'сегодня';
  if (key === tomorrowKey()) return 'завтра';
  return new Date(key + 'T12:00:00').toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* titles */
function paintTitle(id, word){ var n = $(id); if (n) n.textContent = word; }
paintTitle('heroTitle', 'Мой день');
paintTitle('weekTitle', 'Неделя');
paintTitle('calTitle', 'Календарь');
paintTitle('baseTitle', 'База');

/* строка-девиз: своя на каждый день года */
var PHRASES = [
  ["朝は必ず来る。","Утро всегда наступает."],
  ["焦らず、でも諦めずに。","Не спеши, но и не сдавайся."],
  ["七転び八起き。","Упал семь раз — встань восемь."],
  ["継続は力なり。","Постоянство — уже сила."],
  ["一期一会。","Каждая встреча — единственная."],
  ["千里の道も一歩から。","Путь в тысячу ли начинается с шага."],
  ["石の上にも三年。","И холодный камень за три года согреется."],
  ["明日は明日の風が吹く。","Завтра подует завтрашний ветер."],
  ["急がば回れ。","Спешишь — иди в обход."],
  ["塵も積もれば山となる。","Пылинки копятся — вырастет гора."],
  ["初心忘るべからず。","Не забывай, с чего начинала."],
  ["笑う門には福来る。","В дом, где смеются, приходит удача."],
  ["有言実行。","Сказала — сделала."],
  ["一日一善。","Одно доброе дело в день."],
  ["為せば成る。","Возьмёшься — получится."],
  ["雨降って地固まる。","После дождя земля твёрже."],
  ["前進あるのみ。","Только вперёд."],
  ["今日できることを明日に延ばすな。","Не откладывай на завтра то, что можно сегодня."],
  ["心配するな、なんとかなる。","Не тревожься — всё как-нибудь да сложится."],
  ["ゆっくり行こう。","Идём не торопясь."],
  ["自分を信じて。","Верь в себя."],
  ["一歩ずつ。","Шаг за шагом."],
  ["深呼吸して。","Сделай глубокий вдох."],
  ["できるよ、大丈夫。","Справишься, всё хорошо."],
  ["今日も良い一日を。","Пусть и сегодня будет хороший день."],
  ["猿も木から落ちる。","И обезьяна падает с дерева — ошибаться можно."],
  ["花より団子。","Дело важнее красивых слов."],
  ["井の中の蛙、大海を知らず。","Не сиди в колодце — смотри шире."]
];
function dailyPhrase(){
  var now = new Date();
  var day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  return PHRASES[day % PHRASES.length];
}
function jpBlock(){
  var p = dailyPhrase();
  return '<div class="next__jp"><b>' + p[0] + '</b><span>' + p[1] + '</span></div>';
}

/* ---------- state ---------- */
var D = null;

/* ---------- доступ только для владельца ---------- */
var OWNER_ID = 5156804687;
function ownerOk(){
  var h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return true; // локальная разработка
  if (MY_KEY) return true;                                             // иконка на экране телефона
  var u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  return !!(u && String(u.id) === String(OWNER_ID));
}
function lockScreen(){
  document.body.innerHTML =
    '<div class="fatal">' +
      '<div style="font-size:44px;line-height:1;margin-bottom:14px">🔒</div>' +
      '<h2>Только для владельца</h2>' +
      '<p>Откройте из своего Telegram — или введите личный ключ, если приложение запущено с экрана телефона.</p>' +
      '<input id="lockKey" placeholder="личный ключ" autocomplete="off" ' +
        'style="width:100%;max-width:320px;height:46px;border-radius:14px;border:1px solid rgba(255,226,236,.25);' +
        'background:rgba(52,44,74,.6);color:#F4EDF2;padding:0 14px;font-size:16px;margin-top:14px">' +
      '<button id="lockGo" style="width:100%;max-width:320px;height:48px;margin-top:10px;border:0;border-radius:14px;' +
        'background:linear-gradient(180deg,#FF8FA8,#F26D8E);color:#3a1622;font-size:15px;font-weight:700">Войти</button>' +
    '</div>';
  var go = document.getElementById('lockGo');
  if (go) go.onclick = function(){
    var v = (document.getElementById('lockKey').value || '').trim();
    if (!v) return;
    try { localStorage.setItem('myday_key', v); } catch(e){}
    location.href = '/?k=' + encodeURIComponent(v);
  };
}

function boot(){
  if (!ownerOk()){ lockScreen(); return; }
  store.load().then(function(data){ D = data; render(); }).catch(function(err){
    var msg = (err && err.message) || '';
    if (msg.indexOf('403') >= 0 || msg.indexOf('личное приложение') >= 0){
      lockScreen();               // просто нет ключа — даём его ввести, а не пугаем ошибкой
      return;
    }
    $('app').innerHTML =
      '<div class="fatal"><h2>Не удалось загрузить данные</h2>' +
      '<p>' + (err && err.message ? err.message : 'нет доступа к data.json') + '</p>' +
      '<button onclick="store.reset();location.reload()">Попробовать снова</button></div>';
    ['screen-today','fab','nav'].forEach(function(id){ var n = $(id); if(n) n.style.display = 'none'; });
  });
}

/* Федя: Ксения просила с главного экрана быстро смотреть завтрашний день.
   Переключатель меняет только ленту и дату — счётчики всегда про сегодня. */
var viewDay = 'today';
function viewKey(){ return viewDay === 'tomorrow' ? tomorrowKey() : todayKey(); }

function render(){
  var d = new Date(viewKey()+'T00:00:00');
  $('dayDate').textContent = d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
  var sw = document.querySelectorAll('#daySwitch .daysw__b');
  Array.prototype.forEach.call(sw, function(b){ b.classList.toggle('on', b.dataset.view === viewDay); });
  renderNext(); renderCounters(); renderFeed();
}

function todaysTasks(){ return D.tasks.filter(function(t){ return taskDay(t) === viewKey(); }); }

function renderNext(){
  var box = $('nextBlock');
  var pending = todaysTasks().filter(function(t){ return !t.done; })
    .sort(function(a,b){ return toMin(a.time) - toMin(b.time); });
  if (!pending.length){
    box.className = 'card card--mint next next--empty';
    box.innerHTML = '<div class="card__tab">Дальше</div><div class="card__body">' +
      (viewDay === 'tomorrow' ? 'Завтра пока пусто 🌿' : 'На сегодня всё 🌿') + jpBlock() + '</div>';
    box.onclick = null; return;
  }
  var t = pending[0];
  box.className = 'card card--mint next';
  box.innerHTML =
    '<div class="card__tab">Дальше</div>' +
    '<div class="card__body">' +
      '<div class="next__row">' + (t.time ? '<span class="next__time">' + t.time + '</span>' : '') + '<span class="next__name">' + t.title + '</span></div>' +
      (t.contact ? '<div class="next__contact">' + t.contact + '</div>' : '') +
      jpBlock() +
    '</div>';
  box.onclick = function(){ openTask(t.id); };
}

/* Федя: во всех счётчиках показываем не «из скольких», а сколько ещё осталось —
   Ксения 04.09.2026: «показывай сразу остаток до плана», потом то же про еду и воду. */
function planLeftLabel(plan){
  var left = (plan.goal || 0) - (plan.current || 0);
  if (left <= 0) return 'план закрыт 🎉';
  return 'осталось ' + fmtMoney(left) + ' ' + plan.unit;
}

function leftLabel(c, doneText){
  var left = (c.goal || 0) - (c.current || 0);
  if (left <= 0) return doneText;
  return 'осталось ' + left + ' ' + c.unit;
}

function renderCounters(){
  var c = D.counters, wrap = $('counters');
  var plan = c.plan, food = c.food, dt = c.importantDate;
  var left = daysUntil(dt.date);
  var datePct = Math.max(0, Math.min(1, (30 - left)/30)) * 100;
  function pct(a,b){ return Math.max(0, Math.min(100, Math.round(a/b*100))); }
  function mini(variant, title, num, cap, p){
    return '<div class="mini card ' + variant + '">' +
      '<div class="card__tab">' + title + '</div>' +
      '<div class="card__body">' +
        '<div class="mini__num">' + num + '</div>' +
        '<div class="mini__cap">' + cap + '</div>' +
        '<div class="bar"><i style="width:' + p + '%"></i></div>' +
      '</div></div>';
  }
  var water = c.water || { title:'ВОДА', current:0, goal:1500, unit:'мл' };
  wrap.innerHTML =
    '<div id="planCard" style="cursor:pointer">' +
    mini('card--pink', plan.title, fmtMoney(plan.current) + ' ' + plan.unit, planLeftLabel(plan), pct(plan.current, plan.goal)) +
    '</div><div id="foodCard" style="cursor:pointer">' +
    mini('card--yellow', food.title, food.current + ' ' + food.unit, leftLabel(food, 'норма набрана'), pct(food.current, food.goal)) +
    '</div><div id="waterCard" style="cursor:pointer">' +
    mini('card--mint', water.title, water.current + ' ' + water.unit, leftLabel(water, 'норма выпита 💧'), pct(water.current, water.goal)) +
    '</div><div id="dateCard" style="cursor:pointer">' +
    mini('card--lav', dt.title, left + (left === 1 ? ' день' : (left >= 2 && left <= 4 ? ' дня' : ' дней')), dt.label, datePct) +
    '</div>';
  // Федя: счётчики открываются — план и дата правятся, еда ведёт в дневник дня
  if ($('planCard')) $('planCard').onclick = openPlanCard;
  if ($('foodCard')) $('foodCard').onclick = openFoodDiary;
  if ($('waterCard')) $('waterCard').onclick = openWaterCard;
  if ($('dateCard')) $('dateCard').onclick = openDatesCard;
}

function renderFeed(){
  var feed = $('feed'); feed.innerHTML = '';
  var list = todaysTasks().slice().sort(function(a,b){
    if (a.done !== b.done) return a.done ? 1 : -1;
    return toMin(a.time) - toMin(b.time);
  });
  list.forEach(function(t){
    var node = el(
      '<div class="task ' + t.type + (t.done ? ' done' : '') + '" tabindex="0">' +
        '<span class="task__band" aria-hidden="true"></span>' +
        '<div class="t-body">' +
          '<div class="t-top">' + (t.time ? '<span class="t-time">' + t.time + '</span>' : '') + '<span class="t-title">' + t.title + '</span></div>' +
          (t.subtitle ? '<div class="t-sub">' + t.subtitle + '</div>' : '') +
        '</div>' +
        '<button class="check' + (t.done ? ' on' : '') + '" aria-label="Готово"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>' +

    );
    node.querySelector('.check').addEventListener('click', function(ev){ ev.stopPropagation(); toggleDone(t.id); });

/* ---------- week ---------- */
function byTime(a,b){ return toMin(a.time) - toMin(b.time); }
function ruDow(key){ return new Date(key+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'}); }
function ruNum(key){ return new Date(key+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function plural(n,one,few,many){ var m=n%100; if(m>=11&&m<=14) return many; var d=n%10; return d===1?one:(d>=2&&d<=4?few:many); }
function shortTitle(s){ return s.length>24 ? s.slice(0,23)+'…' : s; }
function weekDays(){
  var base = new Date(todayKey()+'T12:00:00');
  base.setDate(base.getDate() - ((base.getDay()+6)%7));
  var out = [];
  for (var i=0;i<7;i++){ var d=new Date(base); d.setDate(base.getDate()+i); out.push(ymd(d)); }
  return out;
}
function dayTasks(key){ return D.tasks.filter(function(t){ return taskDay(t)===key; }).slice().sort(byTime); }
function keyItems(key){ return dayTasks(key).filter(function(t){ return t.type==='clients' || t.type==='study' || t.amount; }); }

function renderWeek(){
  var days = weekDays();
  $('weekRange').textContent = ruNum(days[0]) + ' – ' + ruNum(days[6]);
  var wrap = $('weekList'); wrap.innerHTML = '';
  days.forEach(function(key){
    var all = dayTasks(key), main = keyItems(key), n = all.length;
    var cls = n===0 ? 'free' : (n>=4 ? 'packed' : 'busy');
    var isToday = key === todayKey();
    var items = main.length
      ? main.slice(0,2).map(function(t){ return (t.time ? t.time+' ' : '')+shortTitle(t.title); }).join('  ·  ') + (main.length>2 ? '  +'+(main.length-2) : '')
      : (n ? ('дел: '+n) : 'Свободно');
    var dots = '';
    for (var i=0;i<5;i++) dots += '<i class="'+(i<Math.min(5,n)?'on':'')+'"></i>';
    var node = el(
      '<div class="wday '+cls+(isToday?' today':'')+'" tabindex="0">' +
        '<span class="wday__band"></span>' +
        '<div class="wday__date"><div class="wday__dow">'+ruDow(key)+'</div><div class="wday__num">'+ruNum(key)+'</div></div>' +
        '<div class="wday__body">' +
          '<div class="wday__items">'+items+'</div>' +
          '<div class="wday__meta"><span class="wday__dots">'+dots+'</span>'+(isToday?'<span class="wday__tag">Сегодня</span>':'')+'</div>' +
        '</div>' +
      '</div>'
    );
    node.addEventListener('click', function(){ openDay(key); });
    node.addEventListener('keydown', function(ev){ if (ev.key==='Enter') openDay(key); });
    wrap.appendChild(node);
  });
}

function openDay(key){
  var d = new Date(key+'T12:00:00');
  var list = dayTasks(key);

    ? list.map(function(t){

var calMonth = null;
function renderCalendar(){
  if (!calMonth){ var t = new Date(todayKey()+'T12:00:00'); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  var year = calMonth.getFullYear(), mon = calMonth.getMonth();
  $('calMonthLbl').textContent = calMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  var startDow = (new Date(year,mon,1).getDay()+6)%7;
  var daysIn = new Date(year,mon+1,0).getDate();
  var cells = Math.ceil((startDow+daysIn)/7)*7;
  var gridStart = new Date(year,mon,1-startDow);
  var grid = $('calGrid'); grid.innerHTML = '';
  for (var i=0;i<cells;i++){
    var d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    var key = ymd(d);
    var inMonth = d.getMonth()===mon;
    var n = inMonth ? dayTasks(key).length : 0;
    var isToday = key === todayKey();
    var dots = '';
    for (var k=0;k<Math.min(3,n);k++) dots += '<i></i>';
    var cell = el(
      '<div class="cal-cell'+(inMonth?'':' out')+(isToday?' today':'')+(n>=4?' pk':'')+'"'+(inMonth?' tabindex="0"':'')+'>' +
        '<span>'+d.getDate()+'</span>' +
        '<span class="cal-cell__dots">'+dots+'</span>' +
      '</div>'
    );
    if (inMonth){
      (function(k){
        cell.addEventListener('click', function(){ openDayCal(k); });
        cell.addEventListener('keydown', function(ev){ if (ev.key==='Enter') openDayCal(k); });
      })(key);
    }
    grid.appendChild(cell);
  }
}
function calShift(delta){
  if (!calMonth){ renderCalendar(); }
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+delta, 1);
  renderCalendar();
}

/* ---------- Федя: запись на сервер ----------
   Кнопки отвечают мгновенно: закрываем лист и показываем результат сразу,
   а данные подтягиваются следом. Подпись телеграма уходит в теле запроса —
   в заголовке нельзя, кириллица в имени ломает fetch на маке. */
var LAST_WRITE = 0;   // когда она последний раз что-то нажала

function apiSend(path, body, okText, after){
  haptic('light');
  LAST_WRITE = Date.now();
  if (okText) toast(okText);
  closeSheet();
  body.init = (TG && TG.initData) ? TG.initData : '';
  if (MY_KEY) body.key = MY_KEY;
  fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : 'не вышло');
      playPing('done');
      if (after) after(res.j);
      refreshSoon();
    })
    .catch(function(e){ playPing('error'); toast('Не сохранилось: ' + e.message); });
}

/* Дело, которое сервер только что создал, показываем сразу:
   пересборка данных из календаря занимает несколько секунд, а ждать нечего. */
function addTaskLocally(j){
  if (!j || !j.task || !D || !D.tasks) return;
  var t = j.task;
  var already = false;
  D.tasks.forEach(function(x){ if (x.gid && x.gid === t.gid) already = true; });
  if (!already) D.tasks.push(t);
  D.tasks.sort(function(a, b){
    return (a.day + (a.time || '99:99')).localeCompare(b.day + (b.time || '99:99'));
  });
  render();
  if ($('screen-week') && $('screen-week').classList.contains('active')) renderWeek();
  if ($('screen-calendar') && $('screen-calendar').classList.contains('active')) renderCalendar();
}

function refreshSoon(){
  [1500, 6000, 12000, 20000].forEach(function(ms){
    setTimeout(function(){
      store.load().then(function(d){
        // данные собраны раньше, чем она нажала кнопку — они ещё не знают
        // про её правку. Подменять ими экран нельзя, счётчик скакал назад.
        if (d && d.built && d.built * 1000 < LAST_WRITE) return;
        D = d; render();
        if ($('screen-week') && $('screen-week').classList.contains('active')) renderWeek();
        if ($('screen-calendar') && $('screen-calendar').classList.contains('active')) renderCalendar();
      });
    }, ms);
  });
}

function applyFood(what, j){
  if (!j || !D || !D.counters) return;
  if (typeof j.total === 'number') D.counters.food.current = j.total;
  D.meals = D.meals || { kcal:0, prot:0, list:[] };
  D.meals.kcal = (typeof j.total === 'number') ? j.total : D.meals.kcal;
  D.meals.prot = (typeof j.total_prot === 'number') ? j.total_prot : D.meals.prot;
  D.meals.list = (D.meals.list || []).concat([{ what: what, kcal: j.kcal || 0, slot: '' }]);
  store.save(D);
  render();
}

/* Федя: короткий звук на действие. Генерим сам, файл не нужен.
   Звук включается/выключается в карточке дат, состояние помним. */
var SOUND_ON = (function(){ try { return localStorage.getItem('myday_sound') !== 'off'; } catch(e){ return true; } })();
var _actx = null;
function playPing(kind){
  if (!SOUND_ON) return;
  try {
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();
    var t = _actx.currentTime;
    var notes = kind === 'error' ? [330, 247] : (kind === 'done' ? [660, 880] : [780]);
    notes.forEach(function(f, i){
      var o = _actx.createOscillator(), g = _actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.18, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.22);
      o.connect(g); g.connect(_actx.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.24);
    });
  } catch(e){}
}
function toggleSound(){
  SOUND_ON = !SOUND_ON;
  try { localStorage.setItem('myday_sound', SOUND_ON ? 'on' : 'off'); } catch(e){}
  if (SOUND_ON) playPing('done');
  toast(SOUND_ON ? 'Звук включён' : 'Звук выключен');
}

/* Федя: приложение открывается и в телеграме, и иконкой с экрана телефона.
   Методы телеграма работают только внутри него, поэтому снаружи открываем ссылку сами. */
function inTelegram(){ return !!(TG && TG.initData); }

function contactAction(c){
  var h = (c.contact || '').trim();
  if (!h) return toast('Контакта нет в базе — открой CRM');

  // из контакта делаем ссылку: ник → телеграм, всё остальное с цифрами → звонок
  var url, nick = h.match(/@([A-Za-z0-9_]{3,})/);
  if (nick){
    url = 'https://t.me/' + nick[1];
  } else {
    var digits = h.replace(/[^\d+]/g, '');
    if (digits.replace(/\D/g, '').length >= 10){
      url = 'tel:' + digits;
    } else {
      return toast('Контакт: ' + h);   // ни ника, ни телефона — просто показываем
    }
  }

  if (url.indexOf('tel:') === 0){
    location.href = url;               // звонок работает везде одинаково
    return;
  }
  if (inTelegram() && TG.openTelegramLink) return TG.openTelegramLink(url);
  if (inTelegram() && TG.openLink) return TG.openLink(url);
  window.open(url, '_blank');
}
function crmAction(c){
  if (!c.crmUrl) return toast('Ссылки на карточку нет');
  openUrl(c.crmUrl);
}

/* ---------- actions ---------- */
function findTask(id){ return D.tasks.filter(function(t){ return t.id === id; })[0]; }

function toggleDone(id){
  var t = findTask(id); if (!t) return;
  t.done = !t.done; haptic('light'); playPing(t.done ? 'done' : 'tap');
  store.save(D).then(render);
  if (t.key){
    fetch('api/done', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key:t.key, done:t.done, init:(TG && TG.initData) ? TG.initData : '',
                             key_auth: MY_KEY }) })
      .catch(function(){ toast('Отметка не сохранилась на сервере'); });
  }
}

function deferTask(id){
  var t = findTask(id); if (!t || t.done) return;
  haptic('medium');
  apiSend('api/move', { gid:t.gid, day:tomorrowKey(), time:t.time || '' },
          'Перенесено на завтра · ' + t.time);

    '<button class="btn ghost" id="mClose">Закрыть</button>'

/* ---------- schedule ---------- */
function freeSlots(dayKey){
  var taken = D.tasks.filter(function(t){ return taskDay(t) === dayKey; }).map(function(t){ return toMin(t.time); });
  var out = [];
  for (var m = 600; m <= 1140; m += 30){
    if (taken.some(function(x){ return Math.abs(x - m) < 30; })) continue;
    out.push(fromMin(m));
  }
  return out;
}

function openSchedule(){
  var pick = { day: todayKey(), time: null, name: '', contact: '' };
  function capture(){
    if ($('sName')) pick.name = $('sName').value;
    if ($('sContact')) pick.contact = $('sContact').value;
  }
  function slotChips(){
    var free = freeSlots(pick.day);
    return free.length
      ? free.map(function(s){ return '<button class="chip' + (pick.time === s ? ' on' : '') + '" data-slot="' + s + '">' + s + '</button>'; }).join('')
      : '<div class="muted">На этот день свободных окон нет — впиши время вручную</div>';
  }
  function draw(){
    sheet(
      '<h3>Поставить встречу</h3>' +
      '<div class="muted">Свободные окна: 10:00–19:00, не в приёмы пищи и учёбу, зазор 30 мин. День и точное время можно задать вручную.</div>' +
      '<label>День</label><div class="chips" id="dayChips">' +
        '<button class="chip' + (pick.day === todayKey() ? ' on' : '') + '" data-day="' + todayKey() + '">Сегодня</button>' +
        '<button class="chip' + (pick.day === tomorrowKey() ? ' on' : '') + '" data-day="' + tomorrowKey() + '">Завтра</button>' +
      '</div>' +
      '<input id="sDate" type="date" class="time-inp" value="' + pick.day + '" aria-label="Дата">' +
      '<label>Время</label><div class="chips" id="slotChips">' + slotChips() + '</div>' +
      '<input id="sTime" type="time" class="time-inp" value="' + (pick.time || '') + '" aria-label="Точное время">' +
      '<label>Имя</label><input id="sName" placeholder="напр. Анна В." value="' + esc(pick.name) + '">' +
      '<label>Контакт</label><input id="sContact" placeholder="@nick или телефон" value="' + esc(pick.contact) + '">' +
      '<button class="btn" id="sSave">Добавить</button>' +
      '<button class="btn ghost" id="mClose">Отмена</button>'
    );
    Array.prototype.forEach.call(document.querySelectorAll('#dayChips .chip'), function(b){
      b.onclick = function(){ capture(); pick.day = b.dataset.day; pick.time = null; draw(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('#slotChips .chip'), function(b){
      b.onclick = function(){ capture(); pick.time = b.dataset.slot; draw(); };
    });
    $('sDate').addEventListener('change', function(){ capture(); if (this.value){ pick.day = this.value; pick.time = null; } draw(); });
    $('sTime').addEventListener('change', function(){ capture(); pick.time = this.value || null; draw(); });
    $('mClose').onclick = closeSheet;
    $('sSave').onclick = function(){
      capture();
      var name = pick.name.trim(), contact = pick.contact.trim();
      var day = ($('sDate') && $('sDate').value) || pick.day;
      var time = ($('sTime') && $('sTime').value) || pick.time || '';
      if (!time){ toast('Выбери время'); return; }
      if (!name){ toast('Впиши имя'); return; }
      apiSend('api/task', { day:day, time:time, type:'clients',
                            title:name + ' — зум', contact:contact },
              'Встреча ' + humanDay(day) + ' в ' + time, addTaskLocally);
    };
  }
  draw();
}

  sheet(

    '<div class="muted">Не встреча — учёба, еда или личное. Время можно не указывать.</div>' +
    '<label>День</label><div class="chips" id="adDay">' +
      '<button class="chip on" data-day="' + todayKey() + '">Сегодня</button>' +
      '<button class="chip" data-day="' + tomorrowKey() + '">Завтра</button>' +
    '</div>' +
    '<input id="adDate" type="date" class="time-inp" value="' + todayKey() + '" aria-label="Дата">' +
    '<label>Тип</label><div class="chips" id="adType">' +
      '<button class="chip type-study" data-type="study">Учёба</button>' +
      '<button class="chip type-food" data-type="food">Еда</button>' +
      '<button class="chip type-personal on" data-type="personal">Личное</button>' +
    '</div>' +
    '<label>Название</label><input id="adTitle" placeholder="напр. Забрать посылку">' +
    '<label>Время — необязательно</label><input id="adTime" type="time" class="time-inp">' +
    '<button class="btn" id="adSave">Добавить</button>' +
    '<button class="btn ghost" id="mClose">Отмена</button>'
  );
  Array.prototype.forEach.call(document.querySelectorAll('#adDay .chip'), function(b){

  });
  Array.prototype.forEach.call(document.querySelectorAll('#adType .chip'), function(b){
    b.onclick = function(){
      pick.type = b.dataset.type;
      Array.prototype.forEach.call(document.querySelectorAll('#adType .chip'), function(x){ x.classList.toggle('on', x === b); });
    };
  });
  $('mClose').onclick = closeSheet;
  $('adSave').onclick = function(){
    var title = $('adTitle').value.trim();
    if (!title){ toast('Впиши название'); return; }
    var addDay = ($('adDate') && $('adDate').value) || pick.day;
    apiSend('api/task', { day:addDay, time:($('adTime') && $('adTime').value) || '',
                          type:pick.type, title:title },
            addDay === todayKey() ? 'Добавлено' : 'Добавлено на ' + humanDay(addDay), addTaskLocally);
  };
}

/* ---------- long press ---------- */
function attachLongPress(node, cb){
  var timer = null;
  function start(){ timer = setTimeout(function(){ timer = null; cb(); }, 500); }
  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }
  node.addEventListener('touchstart', start, { passive:true });
  node.addEventListener('touchmove', cancel, { passive:true });
  node.addEventListener('touchend', cancel);
  node.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  node.addEventListener('mousedown', start);
  node.addEventListener('mouseup', cancel);
  node.addEventListener('mouseleave', cancel);
}

/* ---------- sheet ---------- */
function sheet(html){ haptic('light'); $('sheet').innerHTML = html; $('overlay').classList.add('open'); }
function closeSheet(){ $('overlay').classList.remove('open'); }
document.querySelectorAll('#daySwitch .daysw__b').forEach(function(b){
  b.addEventListener('click', function(){
    viewDay = b.dataset.view; haptic('light'); render();
  });
});

$('overlay').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });

/* ---------- nav ---------- */
$('nav').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var scr = b.dataset.scr;
  haptic('light');
  Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function(x){ x.classList.toggle('on', x === b); });
  Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){ s.classList.toggle('active', s.id === 'screen-' + scr); });
  $('fab').classList.toggle('hidden', scr !== 'today');
  $('fabAdd').classList.toggle('hidden', scr !== 'today');
  if (scr === 'week') renderWeek();
  if (scr === 'calendar') renderCalendar();
  if (scr === 'base') renderBase();
});
$('fab').addEventListener('click', openSchedule);
$('fabAdd').addEventListener('click', openAddTask);
$('calPrev').addEventListener('click', function(){ calShift(-1); });
$('calNext').addEventListener('click', function(){ calShift(1); });
$('baseSearch').addEventListener('input', renderBaseList);

boot();
